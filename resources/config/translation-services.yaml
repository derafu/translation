# Complete translation wiring for applications without FrameworkBundle's
# native translator. Import this file to create one shared TranslatorInterface
# service and configure its locale through the parameters below.
#
# Symfony applications use symfony-translation-bundle instead. That bundle
# imports translation-resources-services.yaml and feeds the providers into the
# existing native translator, preserving Symfony's loaders, cache and aliases.
#
# Resource providers join derafu_translation.resource_provider through explicit
# tags. The factory registers their catalogues while constructing the translator;
# no separately requested registrar service is required.
imports:
    - { resource: translation-resources-services.yaml }

parameters:
    derafu.translation.default_locale: en
    derafu.translation.fallback_locales: []

services:
    Symfony\Contracts\Translation\TranslatorInterface:
        class: Symfony\Component\Translation\Translator
        factory: ['Derafu\Translation\TranslatorFactory', create]
        arguments:
            $defaultLocale: '%derafu.translation.default_locale%'
            $fallbackLocales: '%derafu.translation.fallback_locales%'
            $resourceProviders: !tagged_iterator derafu_translation.resource_provider
